name: release

# Every push to main: test -> tag the next version -> create a GitHub Release (library, no binaries).
# Done in one workflow because tags pushed with GITHUB_TOKEN do not trigger other workflows.
# Bump minor/major by raising `version` in Cargo.toml; otherwise the patch number goes up.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked

  tag:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        run: echo "tag=$(bash .github/next-tag.sh)" >> "$GITHUB_OUTPUT"
      - name: Push tag and create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git push origin "HEAD:refs/tags/$TAG"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --verify-tag

